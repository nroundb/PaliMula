<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빨리어 숫자 플래시카드 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
    background: #f3f6fa;
    color: #193459;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app { width: min(760px, 94vw); padding: 28px 0 40px; }
  h1 { text-align:center; margin: 0 0 8px; font-size: 28px; }
  .subtitle { text-align:center; color:#667085; margin-bottom:22px; }
  .top {
    display:flex; justify-content:space-between; align-items:center;
    background:white; border-radius:14px; padding:14px 18px;
    box-shadow:0 4px 18px rgba(25,52,89,.08);
    margin-bottom:18px;
  }
  .top { gap:14px; }
  .search { flex:1; min-width:0; position:relative; max-width:340px; }
  .search input {
    width:100%; font-family:inherit; font-size:15px; padding:9px 34px 9px 12px;
    border:1px solid #cbd5e1; border-radius:9px; color:#193459; background:#f8fafc; outline:none;
  }
  .search input:focus { border-color:#193459; background:white; }
  .search .clear {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:none; background:none; color:#7b8794; font-size:18px; cursor:pointer; display:none; padding:2px 6px;
  }
  .score { font-weight:700; white-space:nowrap; }
  button { font-family: inherit; }
  .controls button {
    border:1px solid #cbd5e1; background:white; color:#193459;
    border-radius:9px; cursor:pointer;
  }
  .controls button:hover:not(:disabled) { background:#edf3f9; }
  .controls button:disabled { opacity:.4; cursor:default; }

  .card-wrap { perspective: 1000px; }
  .card {
    width:100%; height:330px; position:relative;
    transform-style:preserve-3d; transition:transform .55s;
  }
  .card.flipped { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; backface-visibility:hidden;
    background:white; border-radius:22px;
    box-shadow:0 10px 30px rgba(25,52,89,.12);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:25px; text-align:center;
  }
  .back { transform:rotateY(180deg); background:#eef4fa; }
  .back.ok { background:#e8f6ee; }
  .back.ng { background:#fdecec; }
  .label { font-size:14px; color:#7b8794; margin-bottom:12px; }
  .result { font-size:16px; font-weight:700; margin-bottom:8px; }
  .ok .result { color:#1b7f4b; }
  .ng .result { color:#c0392b; }
  .pali { font-size:34px; font-weight:700; color:#4a6285; }
  .main { font-size:64px; font-weight:800; letter-spacing:1px; }
  .front .main { font-size:56px; }
  .desc { margin-top:14px; font-size:16px; line-height:1.55; color:#475467; max-width:560px; }
  .hint { margin-top:18px; color:#7b8794; font-size:14px; }

  .choices {
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:20px;
  }
  .choice {
    border:2px solid #cbd5e1; background:white; color:#193459;
    border-radius:12px; padding:14px; font-size:22px; font-weight:700; cursor:pointer;
  }
  .choice:hover:not(:disabled) { background:#edf3f9; }
  .choice:disabled { cursor:default; }
  .choice.correct { background:#e8f6ee; border-color:#1b7f4b; color:#1b7f4b; }
  .choice.wrong { background:#fdecec; border-color:#c0392b; color:#c0392b; }

  .controls { display:flex; justify-content:center; gap:8px; margin-top:20px; flex-wrap:wrap; }
  .controls button { font-size:15px; padding:11px 16px; }
  .primary { background:#193459 !important; color:white !important; border-color:#193459 !important; }
  .msg { text-align:center; min-height:22px; margin-top:12px; color:#667085; font-size:14px; }

  .progress { margin-top:14px; }
  .bar { height:8px; background:#dce4ec; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; background:#193459; width:0%; transition:width .3s; }

  @media(max-width:520px) {
    .front .main { font-size:42px; }
    .main { font-size:48px; }
    .pali { font-size:28px; }
    .card { height:310px; }
    .desc { font-size:14px; }
    .controls button { flex:1 1 30%; padding:11px 8px; font-size:14px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>빨리어 숫자 플래시카드</h1>
  <div class="subtitle">빨리어를 보고 알맞은 숫자를 선택하세요.</div>

  <div class="top">
    <div class="search">
      <input id="searchInput" type="text" placeholder="검색 (숫자 또는 빨리어)" autocomplete="off" oninput="doSearch()">
      <button class="clear" id="clearBtn" onclick="clearSearch(true)" aria-label="검색어 지우기">×</button>
    </div>
    <div class="score">점수 <span id="score">0</span> / <span id="total">0</span></div>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face front">
        <div class="label">문제 <span id="pos"></span></div>
        <div class="main" id="question"></div>
        <div class="hint">아래 보기 중 정답을 선택하세요.</div>
      </div>
      <div class="face back" id="backFace">
        <div class="result" id="result"></div>
        <div class="pali" id="answerPali"></div>
        <div class="main" id="answerNum"></div>
        <div class="desc" id="desc"></div>
      </div>
    </div>
  </div>

  <div class="choices" id="choices"></div>

  <div class="controls">
    <button id="btnPrev" onclick="prevCard()">← 이전카드</button>
    <button id="btnNext" class="primary" onclick="nextCard()">다음카드 →</button>
    <button onclick="retryWrong()">틀린문항반복</button>
    <button onclick="restart()">처음부터</button>
    <button onclick="shuffleCards()">카드 섞기</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="progress">
    <div class="bar"><div id="bar"></div></div>
  </div>
</div>

<script>
// [숫자, 빨리어, 설명]
const cards = [
  [0,"suñña","‘텅 빔(공)’이라는 뜻이며, 숫자 0을 나타낼 때도 쓰입니다."],
  [1,"eka","‘하나’. ‘홀로, 유일한’이라는 의미로도 쓰입니다."],
  [2,"dve","‘둘’. 복합어에서는 dvi-, du- 형태로 나타납니다."],
  [3,"tayo","‘셋’(남성형). 복합어에서는 ti- 형태로 쓰입니다. (예: 삼보 ti-ratana)"],
  [4,"cattāri","‘넷’(중성형). 사성제(cattāri ariyasaccāni)에 쓰입니다."],
  [5,"pañca","‘다섯’. 오계(pañca-sīla), 오온(pañcakkhandha)에 쓰입니다."],
  [6,"cha","‘여섯’. 육처(saḷāyatana)처럼 합성어에서는 saḷ- 형태가 되기도 합니다."],
  [7,"satta","‘일곱’. 칠각지(satta bojjhaṅga)에 쓰입니다."],
  [8,"aṭṭha","‘여덟’. 팔정도(aṭṭhaṅgika magga)에 쓰입니다."],
  [9,"nava","‘아홉’. ‘새로운’을 뜻하는 nava와 형태가 같습니다."],
  [10,"dasa","‘열’. 십바라밀(dasa pāramī), 십선업 등에 쓰입니다."],
  [11,"ekādasa","eka(1) + dasa(10)가 결합한 ‘열하나’."],
  [12,"dvādasa","dva(2) + dasa(10)가 결합한 ‘열둘’. 십이연기(dvādasa aṅga)에 쓰입니다."],
  [13,"terasa","‘열셋’. 3 + 10이지만 형태가 변해 tayodasa가 아닌 terasa가 됩니다."],
  [14,"cuddasa","‘열넷’. catu(4) + dasa(10)가 변한 형태입니다."],
  [15,"pañcadasa","pañca(5) + dasa(10)로 이루어진 ‘열다섯’."],
  [16,"soḷasa","‘열여섯’. cha 대신 soḷa-라는 특수한 형태를 씁니다."],
  [17,"sattarasa","satta(7) + rasa. 11~18에서는 dasa가 rasa로 바뀌는 경우가 많습니다."],
  [18,"aṭṭhārasa","aṭṭha(8) + rasa로 이루어진 ‘열여덟’."],
  [19,"ekūnavīsati","‘20에서 1이 모자란 수’. eka + ūna(모자란) + vīsati."],
  [20,"vīsati","‘스물’. 20부터 십 단위 수는 -ti, -sa 등의 어미로 끝나는 경우가 많습니다."],
  [30,"tiṃsati","‘서른’. 삼십삼천(tāvatiṃsa)이라는 말에 쓰입니다."],
  [40,"cattālīsa","‘마흔’. cattāri(4)에서 파생된 십 단위 수입니다."],
  [50,"paññāsa","‘쉰’. 맛지마 니까야의 ‘50경 묶음(paṇṇāsa)’ 이름에 쓰입니다."],
  [60,"saṭṭhi","‘예순’. cha(6)와 형태가 많이 달라 따로 외워야 합니다."],
  [70,"sattati","‘일흔’. satta(7)에서 파생된 십 단위 수입니다."],
  [80,"asīti","‘여든’. 부처님의 나이 80세, 80대제자(asīti mahāsāvaka)와 관련됩니다."],
  [90,"navuti","‘아흔’. nava(9)와 닮았지만 어미가 다릅니다."],
  [100,"sata","‘백’. 큰 수를 나타내는 기본 단위입니다."],
  [1000,"sahassa","‘천’. 경전에서 ‘매우 많은 수’를 나타내는 표현으로도 자주 쓰입니다."],
  [100000,"satasahassa","sata(백) × sahassa(천) = ‘십만’. lakkha라고도 합니다."]
];

const fmt = n => n.toLocaleString("en-US");
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const $ = id => document.getElementById(id);

let deck = shuffle([...cards]);  // 기본값: 카드 섞기
let index = 0;
let results = new Map();   // 숫자 -> {choice, ok}
let choicesMap = new Map(); // 숫자 -> 보기 배열
let fillTimer = null;
let searching = false;

function getChoices(num) {
  if (!choicesMap.has(num)) {
    const others = shuffle(cards.map(c => c[0]).filter(n => n !== num)).slice(0, 3);
    choicesMap.set(num, shuffle([num, ...others]));
  }
  return choicesMap.get(num);
}

function fillBack() {
  const [num, pali, desc] = deck[index];
  const r = results.get(num);
  $("answerPali").textContent = pali;
  $("answerNum").textContent = fmt(num);
  $("desc").textContent = desc;
  $("result").textContent = r ? (r.ok ? "✔ 정답입니다!" : "✘ 오답입니다 (선택: " + fmt(r.choice) + ")") : "";
  $("backFace").className = "face back" + (r ? (r.ok ? " ok" : " ng") : "");
}

function render() {
  clearTimeout(fillTimer);
  searching = false;
  $("choices").style.display = "";
  const [num, pali] = deck[index];
  const r = results.get(num);

  $("question").textContent = pali;
  $("pos").textContent = "(" + (index + 1) + " / " + deck.length + ")";

  // 보기 버튼
  const box = $("choices");
  box.innerHTML = "";
  getChoices(num).forEach(opt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = fmt(opt);
    if (r) {
      b.disabled = true;
      if (opt === num) b.classList.add("correct");
      else if (opt === r.choice) b.classList.add("wrong");
    } else {
      b.onclick = () => answer(opt);
    }
    box.appendChild(b);
  });

  // 카드 앞/뒤
  if (r) {
    fillBack();
    $("card").classList.add("flipped");
  } else {
    $("card").classList.remove("flipped");
    fillTimer = setTimeout(fillBack, 300); // 뒤집히는 동안 정답이 미리 보이지 않도록 지연
  }

  updateStatus();
}

function answer(choice) {
  const num = deck[index][0];
  if (results.has(num)) return;
  results.set(num, { choice, ok: choice === num });
  setMsg("");
  render();
}

function updateStatus() {
  let score = 0;
  deck.forEach(c => { const r = results.get(c[0]); if (r && r.ok) score++; });
  $("score").textContent = score;
  $("total").textContent = deck.length;
  $("bar").style.width = ((index + 1) / deck.length * 100) + "%";
  $("btnPrev").disabled = index === 0;
  $("btnNext").disabled = index === deck.length - 1;
}

function setMsg(t) { $("msg").textContent = t; }

function prevCard() { clearSearch(); if (index > 0) { index--; setMsg(""); render(); } }
function nextCard() { clearSearch(); if (index < deck.length - 1) { index++; setMsg(""); render(); } }

function retryWrong() {
  clearSearch();
  const wrong = deck.filter(c => { const r = results.get(c[0]); return r && !r.ok; });
  if (!wrong.length) { setMsg("틀린 문항이 없습니다."); return; }
  wrong.forEach(c => { results.delete(c[0]); choicesMap.delete(c[0]); });
  deck = wrong;
  index = 0;
  setMsg("틀린 문항 " + wrong.length + "개를 다시 풉니다.");
  render();
}

function resetAll(newDeck) {
  clearSearch();
  deck = newDeck;
  results = new Map();
  choicesMap = new Map();
  index = 0;
  setMsg("");
  render();
}

function restart() { resetAll([...cards]); }
function shuffleCards() { resetAll(shuffle([...cards])); }

// ---------- 검색 ----------
const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

function findCard(q) {
  if (/^[\d,\s]+$/.test(q)) {
    const n = parseInt(q.replace(/[,\s]/g, ""), 10);
    return cards.find(c => c[0] === n) || null;
  }
  const k = norm(q);
  const exact = cards.find(c => norm(c[1]) === k);
  if (exact) return exact;
  const pre = cards.filter(c => norm(c[1]).startsWith(k));
  return pre.length === 1 ? pre[0] : null;
}

function doSearch() {
  const q = $("searchInput").value.trim();
  $("clearBtn").style.display = q ? "block" : "none";
  if (!q) { clearSearch(true); return; }

  clearTimeout(fillTimer);
  searching = true;
  const found = findCard(q);
  $("choices").style.display = "none";
  $("pos").textContent = "(검색 결과)";
  if (found) {
    const [num, pali, desc] = found;
    $("question").textContent = pali;
    $("result").textContent = "";
    $("answerPali").textContent = pali;
    $("answerNum").textContent = fmt(num);
    $("desc").textContent = desc;
    $("backFace").className = "face back";
  } else {
    $("question").textContent = q;
    $("result").textContent = "검색 결과 없음";
    $("answerPali").textContent = "";
    $("answerNum").textContent = "";
    $("desc").textContent = "‘" + q + "’에 해당하는 숫자가 없습니다.";
    $("backFace").className = "face back ng";
  }
  $("card").classList.add("flipped");
}

// 검색 상태 해제 (refresh=true면 퀴즈 화면으로 복귀)
function clearSearch(refresh) {
  $("searchInput").value = "";
  $("clearBtn").style.display = "none";
  if (refresh && searching) render();
}

render();
</script>
</body>
</html>
